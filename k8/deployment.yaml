
apiVersion: apps/v1
kind: Deployment

metadata:
  name: weather-forecast-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: weather-forecast

  template:
    metadata:
      labels:
        app: weather-forecast

    spec:
      containers:
        - name: weather-forecast
          image: weather-forecast:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
