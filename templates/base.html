
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SkyCast Weather{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="/">SkyCast</a>
        <nav>
            <a href="/">Current Weather</a>
            <a href="/forecast">7-Day Forecast</a>
            <a href="/about">About</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>SkyCast Weather Forecasting | Flask + Open-Meteo</footer>
</body>
</html>
